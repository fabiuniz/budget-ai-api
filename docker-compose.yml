version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_USER: userlnx
      POSTGRES_PASSWORD: super_senha_123
      POSTGRES_DB: budget_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

localstack:
    image: localstack/localstack:3.0.2
    container_name: budget-sqs-local
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=sa-east-1
    volumes:
      - "./volume/localstack:/var/lib/localstack"
    restart: unless-stopped

volumes:
  pgdata: