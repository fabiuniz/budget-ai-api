version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: budget-postgres
    environment:
      POSTGRES_USER: userlnx
      POSTGRES_PASSWORD: super_senha_123
      POSTGRES_DB: budget_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: